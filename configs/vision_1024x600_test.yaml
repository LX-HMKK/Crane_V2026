serial:
  port: /dev/ttyS1
  baudrate: 115200
  timeout: 0.05
cameras:
  bean:
    device: 0
    width: 1280
    height: 720
    buffer_size: 1
  digit:
    device: 2
    width: 1280
    height: 720
    buffer_size: 1
models:
  bean:
    bin: assets/beans_v4.bin
    cfg: assets/beans_v4_rdkx5_config.yaml
    pt: assets/beans_v4.pt
  digit:
    bin: assets/num.bin
    cfg: assets/num_rdkx5_config.yaml
    pt: assets/num.pt
inference:
  imgsz: 640
  conf_thres: 0.25
  iou_thres: 0.45
  pad: 127
ui:
