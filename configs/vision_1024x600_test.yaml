# =============================================================================
# 2026 物流技术创意赛 RDK X5 视觉运行时配置文件
# -----------------------------------------------------------------------------
# 修改后运行 `python scripts/main_arm64.py` 会自动读取本文件；
# 在校准 UI 中拖动滑块后按 ESC，辅助线位置也会自动写回本文件。
# 注意：文件中的设备号 / 路径 / 分辨率请与现场实际硬件保持一致。
# =============================================================================

# -----------------------------------------------------------------------------
# 串口参数（RDK X5 与 STM32 下位机通信）
# -----------------------------------------------------------------------------
# port      : RDK X5 上的串口设备节点。默认竞赛使用 /dev/ttyS1（40PIN 引脚 8/10）。
#             /dev/ttyS0 是系统调试串口，不要用于下位机通信。
# baudrate  : 波特率。竞赛代码默认按 921600 8/N/1 初始化，请与下位机保持一致。
#             若当前下位机使用 115200，可改为 115200，但需同步修改下位机。
# timeout   : 串口读取超时（秒）。值越小主循环响应越快，但可能漏读 START 命令；
#             建议 0.02~0.1 之间。
serial:
  port: /dev/ttyS1
  baudrate: 115200
  timeout: 0.05

# -----------------------------------------------------------------------------
# 相机参数（两路 USB 相机）
# -----------------------------------------------------------------------------
# device      : V4L2 设备号，对应 /dev/videoN。可通过 `python scripts/main_arm64.py --list-cameras` 查看。
#               插拔顺序改变时，device 号可能变化，建议配合 udev 规则固定（tools/99-crane-cameras.rules）。
# width/height: 相机采集分辨率。YOLO 输入为 640x640，这里只要相机支持即可；
#               常用 1280x720 或 640x480。分辨率越低帧率越高。
# buffer_size : V4L2 缓冲区数量，建议 1~3。设为 1 可降低延迟，但可能偶尔丢帧。
# auto_exposure: 是否启用自动曝光。默认 true；现场光线固定时可设为 false 并配合曝光值调参。
# grayscale   : 是否将相机输出强制转为灰度（仍以 3 通道 BGR 输出供模型使用）。
#               数字识别训练数据为灰度，因此 digit 相机建议开启；豆子识别需要颜色，保持 false。
cameras:
  bean:          # 豆子相机：识别取货区 ①~③ 的豆子
    device: 0
    width: 1280
    height: 720
    buffer_size: 1
    auto_exposure: true
    grayscale: false
    # 掉线重连：连续失败后自动重开相机
    reconnect:
      enabled: true
      after_failures: 3
      interval_sec: 1.0
  digit:         # 数字相机：识别放置区 ④~⑧ 的数字
    device: 2
    width: 1280
    height: 720
    buffer_size: 1
    auto_exposure: true
    grayscale: true
    # 掉线重连：连续失败后自动重开相机
    reconnect:
      enabled: true
      after_failures: 3
      interval_sec: 1.0

# -----------------------------------------------------------------------------
# 模型路径与阈值
# -----------------------------------------------------------------------------
# bin        : RDK X5 BPU 部署模型（必须存在）。
# cfg        : 对应 .bin 的部署配置，包含 imgsz/nc/names/reg_max/strides。
# pt         : x86 测试 / 训练用 PyTorch 权重，仅在 main_amd64.py 或训练时使用。
# conf_thres : 该模型的检测置信度阈值；若省略，则使用下面 inference.conf_thres。
# iou_thres  : 该模型的 NMS IoU 阈值；若省略，则使用下面 inference.iou_thres。
models:
  bean:
    bin: assets/beans_v6.bin
    cfg: assets/beans.yaml
    pt: assets/beans_v6.pt
    conf_thres: 0.7
    iou_thres: 0.45
  digit:
    bin: assets/num_v6.bin
    cfg: assets/num.yaml
    pt: assets/num_v6.pt
    conf_thres: 0.7
    iou_thres: 0.45

# -----------------------------------------------------------------------------
# 推理参数
# -----------------------------------------------------------------------------
# imgsz     : 模型输入尺寸，YOLO11 BPU 当前固定 640，不要改。
# conf_thres: 全局默认检测置信度阈值。若 models.<name>.conf_thres 未设置，则使用本值。
#             调高可减少误检（漏检增加）；调低可召回更多目标（误检增加）。
# iou_thres : 全局默认 NMS IoU 阈值。若 models.<name>.iou_thres 未设置，则使用本值。
#             数字/豆子密集时可适当降低（如 0.3）；目标分散时可保持 0.45。
# pad       : Letterbox 填充灰度值。BPU 模型编译时通常已固定为 127，不建议修改。
inference:
  imgsz: 640
  conf_thres: 0.25
  iou_thres: 0.45
  pad: 127

# -----------------------------------------------------------------------------
# 校准 UI 参数（仅在运行 `python scripts/main_arm64.py` 校准时生效）
# -----------------------------------------------------------------------------
# fullscreen  : 是否全屏显示。现场触摸屏分辨率 1024x600 时通常关闭，窗口运行。
# width/height: 校准窗口大小，建议与现场屏幕分辨率一致。
# max_height  : 视频预览区最大高度（像素）。值越小留给控制面板空间越多。
# fit_mode    : 视频缩放模式。contain=等比缩放留黑边，cover=等比裁剪填满。
# touch_mode  : 是否启用大按钮/滑块，便于现场触摸屏操作。
# inference_overlay : 校准 UI 是否叠加模型检测结果。开启时会额外占用 BPU/
#                     CPU 算力；若校准 UI 仍卡顿，可设为 false 仅保留辅助线。
# slider_*    : 滑块尺寸。slider_width 控制滑槽粗细，slider_height 控制滑块手柄长度；
#               touch_mode=true 时适当调大。为节省面板空间，滑块上方不再显示当前数值。
# button_height: 控制按钮高度。
# padding     : 控件间距。
# font_scale  : 控制面板字体缩放系数。
ui:
  window:
    fullscreen: false
    width: 1024
    height: 600
  video:
    max_height: 420
    fit_mode: contain
  controls:
    touch_mode: true
    slider_width: 16
    slider_height: 32
    button_height: 20
    padding: 1
    font_scale: 0.8
    inference_overlay: true

# -----------------------------------------------------------------------------
# 扫描策略参数
# -----------------------------------------------------------------------------
# frames      : 收到 START 后连续扫描并融合的帧数。越多越稳定，但单次扫描耗时越长。
#               竞赛要求 5~10 Hz，建议 3~7 帧。
# max_retries : 单轮识别失败（如未检测到目标）时的最大重试次数。
# timeout_sec : 扫描任务总超时。超过该时间仍未得到稳定结果，则返回失败。
scan:
  frames: 5
  max_retries: 2
  timeout_sec: 30

# -----------------------------------------------------------------------------
# 辅助线位置（核心调参区域）
# -----------------------------------------------------------------------------
# 这些竖直辅助线把画面划分为若干区域，决定豆子/数字归属哪个货位。
# 运行 `python scripts/main_arm64.py`，按 1/2 切换相机，拖动滑块实时调整，
# ESC 退出后自动保存。
#
# bean 相机（取货区 ①②③）：
#   left_x / right_x 两条竖线把画面分成左/中/右三列。
#   通常 left_x < right_x，数值为像素坐标（0 ~ width）。
#
# digit 相机（放置区 ④⑤⑥⑦⑧）：
#   x1~x4 四条竖线把画面分成五列。
#   必须满足 x1 < x2 < x3 < x4，且都在画面宽度范围内。
lines:
  bean:
    left_x: 515
    right_x: 837
  digit:
    x1: 251
    x2: 515
    x3: 764
    x4: 1046

# -----------------------------------------------------------------------------
# 类别映射
# -----------------------------------------------------------------------------
# bean_to_digit : 把豆子检测器的类别名映射为协议颜色编码。
#                 该编码同时作为结果帧 C1~C3 的颜色值。
#                 当前：yellow（黄豆）-> 1，green（绿豆）-> 2，white（白芸豆）-> 3。
#                 若训练时类别顺序改变，或下位机协议变化，同步修改此处。
mapping:
  bean_to_digit:
    yellow: 1
    green: 2
    white: 3
